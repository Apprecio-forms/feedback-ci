<script>
  // 1. LOGOS SEGÚN PAÍS
  var LOGO_MEXICO = "https://lh3.googleusercontent.com/d/1q8BvfZf_gvE7Z7j5JZA2bMzxtxG7vsYG";
  var LOGO_OTROS  = "https://lh3.googleusercontent.com/d/1Bdr6iTq7ZnhCxUD6BGBqTsxAd7DpXdFo";

  // 2. PARÁMETROS URL (?id=...&tipo=...&nombre=...&pais=...)
  const urlParams = new URLSearchParams(window.location.search);
  const clientId = urlParams.get('id') || 'SIN_ID';
  const tipoEncuesta = urlParams.get('tipo') ? urlParams.get('tipo').toLowerCase() : 'encuesta_silencio';
  const nombreCliente = urlParams.get('nombre') ? decodeURIComponent(urlParams.get('nombre')) : '';
  const paisCliente = urlParams.get('pais') ? decodeURIComponent(urlParams.get('pais')).toLowerCase() : '';

  // 3. LOGO DINÁMICO
  const imgElement = document.getElementById('company-logo');
  if (paisCliente.includes('mexico') || paisCliente.includes('méxico')) {
    imgElement.src = LOGO_MEXICO;
  } else {
    imgElement.src = LOGO_OTROS;
  }

  if (nombreCliente !== '') {
    document.getElementById('greeting-text').innerText = `Hola ${nombreCliente}, nos gustaría conocer tu opinión.`;
  }

  // 4. ADAPTACIÓN DE PREGUNTAS SEGÚN LAS 3 AUDIENCIAS
  if (tipoEncuesta === 'perdido_historico') {
    // AUDIENCIA 2: PERDIDO HISTÓRICO
    document.getElementById('q1-label').innerText = '1. ¿Qué tan relevante fue en su momento nuestra solución para tu operación? (1 al 10)';
    document.getElementById('q2-label').innerText = '2. ¿Actualmente sigues requiriendo o comprando este tipo de soluciones?';
    document.getElementById('q3-label').innerText = '3. ¿Cuál fue la razón principal por la que se discontinuó la compra con nosotros?';
    document.getElementById('q4-label').innerText = '4. ¿Qué tendría que cambiar para que vuelvas a considerarnos en el futuro?';

  } else if (tipoEncuesta === 'prevencion_churn_ml') {
    // AUDIENCIA 3: PREVENCIÓN CHURN ML
    document.getElementById('q1-label').innerText = '1. ¿Cómo calificarías tu experiencia reciente con nuestro servicio/atención? (1 al 10)';
    document.getElementById('q2-label').innerText = '2. ¿Nuestra solución actualmente cumple con tus expectativas operativas?';
    document.getElementById('q3-label').innerText = '3. ¿Hay algún aspecto prioritario que debamos mejorar de inmediato?';
    document.getElementById('q4-label').innerText = '4. ¿Qué podemos hacer hoy para fortalecer nuestra relación contigo?';

  } else {
    // AUDIENCIA 1: ENCUESTA SILENCIO (POR DEFECTO)
    document.getElementById('q1-label').innerText = '1. ¿Qué tan relevante es hoy nuestra solución para tus necesidades actuales? (1 al 10)';
    document.getElementById('q2-label').innerText = '2. ¿Con qué frecuencia sueles utilizar o comprar este tipo de solución?';
    document.getElementById('q3-label').innerText = '3. ¿Cuál ha sido la principal razón por la que no has tenido actividad reciente?';
    document.getElementById('q4-label').innerText = '4. ¿Qué tendría que pasar para que retomes el uso de nuestra solución?';
  }

  // 5. URL WEB APP (Se actualizará cuando implementemos la Web App de Apps Script)
  const WEBHOOK_URL = "AQUI_PEGA_TU_URL_DE_APPS_SCRIPT";

  // 6. ENVÍO
  document.getElementById('survey-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerText = "Enviando respuestas...";

    const payload = {
      id: clientId,
      tipo: tipoEncuesta,
      nombre: nombreCliente,
      q1: document.getElementById('q1').value,
      q2: document.getElementById('q2').value,
      q3: document.getElementById('q3').value,
      q4: document.getElementById('q4').value
    };

    fetch(WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(() => {
      document.getElementById('form-container').style.display = 'none';
      document.getElementById('thank-you-message').style.display = 'block';
    }).catch(err => {
      alert('Ocurrió un inconveniente al enviar tu respuesta.');
      btn.disabled = false;
      btn.innerText = "Enviar Respuestas";
    });
  });
</script>
