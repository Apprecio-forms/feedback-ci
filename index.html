<script>
var LOGO_MEXICO = "https://lh3.googleusercontent.com/d/1q8BvfZf_gvE7Z7j5JZA2bMzxtxG7vsYG";
var LOGO_OTROS  = "https://lh3.googleusercontent.com/d/1Bdr6iTq7ZnhCxUD6BGBqTsxAd7DpXdFo";

let emailFromUrl = "";
let paisFromUrl = "";
let audienciaFromUrl = "";
let idEnvioFromUrl = "";

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    
    emailFromUrl = urlParams.get('utm_email') || urlParams.get('email') || "";
    paisFromUrl = urlParams.get('pais') || "";
    audienciaFromUrl = urlParams.get('audiencia') || urlParams.get('categoria') || urlParams.get('aud') || "";
    idEnvioFromUrl = urlParams.get('id_envio') || "";
    
    if (emailFromUrl) document.getElementById('emailInput').value = emailFromUrl;
    if (paisFromUrl) document.getElementById('paisInput').value = paisFromUrl;
    if (audienciaFromUrl) document.getElementById('audienciaInput').value = audienciaFromUrl;
    if (idEnvioFromUrl) document.getElementById('idEnvioInput').value = idEnvioFromUrl;

    // 1. LÓGICA DINÁMICA DE LOGO POR PAÍS
    const paisNormalizado = paisFromUrl.trim().toLowerCase();
    const logoTarget = (paisNormalizado === "méxico" || paisNormalizado === "mexico") ? LOGO_MEXICO : LOGO_OTROS;
    
    document.getElementById('appLogo').src = logoTarget;
    document.getElementById('appLogoSuccess').src = logoTarget;

    // 2. LÓGICA DINÁMICA DE PREGUNTAS POR AUDIENCIA
    const audNormalizada = audienciaFromUrl.trim().toLowerCase();
    
    // Evalúa si es Churn
    const esChurn = audNormalizada.includes("churn") || audNormalizada === "c" || audNormalizada === "1";

    if (esChurn) {
        document.getElementById('block-churn').style.display = 'block';
        document.getElementById('txtMejora').required = true;
    } else {
        // Aplica para Silencio ('s'), Perdido Histórico ('p', 'ph', 'perdido') o valor por defecto
        document.getElementById('block-inactividad').style.display = 'block';
        document.getElementById('txtRetomar').required = true;
    }
};

function toggleConditionalInput(checkbox, targetInput) {
    checkbox.addEventListener('change', function() {
        if (this.checked) {
            targetInput.style.display = 'block';
        } else {
            targetInput.style.display = 'none';
            targetInput.value = '';
        }
    });
}

toggleConditionalInput(document.getElementById('chkProveedor'), document.getElementById('inputProveedor'));
toggleConditionalInput(document.getElementById('chkOtro'), document.getElementById('inputOtro'));
toggleConditionalInput(document.getElementById('chkOtroDesafio'), document.getElementById('inputOtroDesafio'));

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzG106P9LmNFwM2oBenXDhIu6YSKVk8ZYRlG0TP63qzQwRuYM6WqvnKH_AzQU9YsWc1/exec"; 

document.getElementById('surveyForm').onsubmit = function(e) {
    e.preventDefault();

    const audNormalizada = audienciaFromUrl.trim().toLowerCase();
    const esChurn = audNormalizada.includes("churn") || audNormalizada === "c" || audNormalizada === "1";
    const activeBlockId = esChurn ? 'block-churn' : 'block-inactividad';
    
    const checkboxes = document.querySelectorAll(`#${activeBlockId} input[type="checkbox"]`);
    const isChecked = Array.from(checkboxes).some(cb => cb.checked);

    if (!isChecked) {
        alert("Por favor, selecciona al menos una opción en la pregunta 3.");
        return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = 'ENVIANDO...';

    const formData = new FormData(this);
    const params = new URLSearchParams(formData);

    fetch(WEB_APP_URL + "?" + params.toString(), {
        method: 'GET',
        mode: 'no-cors'
    }).then(() => {
        document.getElementById('form-content').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
        window.scrollTo(0,0);
    }).catch(err => {
        alert("Error al enviar la encuesta.");
        btn.disabled = false;
        btn.innerText = 'ENVIAR ENCUESTA';
    });
};
</script>
